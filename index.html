<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <title>Super Mario Bros.</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#000000" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <link href="/src/styles.css" rel="stylesheet" />

        <link rel="icon" type="image/gif" href="favicon.gif" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>

    <body>
        <!-- #stage is the "game container": it is what the fullscreen button sends to fullscreen. -->
        <div id="stage">
            <section id="game"></section>

            <nav id="toolbar" aria-label="Game tools">
                <button id="menu-button" type="button" aria-expanded="false" aria-controls="controls">Menu</button>
                <button id="fullscreen-button" type="button" aria-pressed="false" hidden>Fullscreen</button>
            </nav>

            <div id="rotate-overlay" role="alert">
                <div class="rotate-phone" aria-hidden="true"></div>
                <h2>Rotate your phone</h2>
                <p>Super Mario Bros. plays best sideways. Turn your phone to landscape to jump in!</p>
            </div>
        </div>

        <section id="controls"></section>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
